services:
  proxy:
    build: .
    restart: unless-stopped
    environment:
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}
  caddy:                       # automatic free HTTPS
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
volumes:
  caddy_data:
